<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نور - المصحف والأذكار</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d2e">
<style>
body{margin:0;font-family:sans-serif;background:#fdfbf7;color:#0b3d2e;text-align:center}
header{background:#0b3d2e;color:#fff;padding:16px;font-size:22px}
.card{margin:20px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
button{background:#0b3d2e;color:#fff;border:0;padding:12px 20px;border-radius:10px;font-size:16px;margin:5px}
#quran{font-size:22px;line-height:2}
</style>
</head>
<body>
<header>🌙 نور - المصحف والأذكار</header>
<div class="card">
<h3>القرآن الكريم</h3>
<div id="quran">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>اقرأ وردك اليومي بخشوع</div>
<button onclick="document.getElementById('quran').innerHTML='سُبْحَانَ اللَّهِ وَبِحَمْدِهِ<br>سُبْحَانَ اللَّهِ الْعَظِيمِ'">اذكر الله</button>
</div>
<div class="card">
<h3>أذكار الصباح</h3>
<p>اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور</p>
<button onclick="alert('تم التسبيح!')">سبح 33 مرة</button>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
